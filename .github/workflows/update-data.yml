name: Refresh wiki skin data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hashes of art the build has already seen. Without it every run re-downloads
      # about 4700 thumbnails just to compute the same dHash values again.
      - name: Restore dHash cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dhash-${{ github.run_id }}
          restore-keys: dhash-

      - name: Install Pillow
        run: pip install Pillow

      - name: Build catalogues
        run: python build_data.py

      # The push below triggers the Pages workflow, which assembles and deploys
      # the site. Deploying here as well would race with it.
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/skins.json data/skins-wr.json data/skins-lor.json; then
            echo "No changes to the skin catalogues"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skins.json data/skins-wr.json data/skins-lor.json
          git commit -m "chore: refresh wiki skin data ($(date +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main
