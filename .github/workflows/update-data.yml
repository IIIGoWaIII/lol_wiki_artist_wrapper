name: Refresh wiki skin data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hashes of art the build has already seen. Without it every run re-downloads
      # about 4700 thumbnails just to compute the same dHash values again.
      - name: Restore dHash cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dhash-${{ github.run_id }}
          restore-keys: dhash-

      - name: Install Pillow
        run: pip install Pillow

      - name: Build catalogues
        run: python build_data.py

      - name: Find shared splashes
        run: python build_dupes.py

      # The push below triggers the Pages workflow, which assembles and deploys
      # the site. Deploying here as well would race with it.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every tracked file under data/ instead of a fixed list: the
          # build rewrites more than the catalogues (dupes.json, tags.json) and
          # a modified-but-unstaged file makes the `git pull --rebase` below
          # abort with "You have unstaged changes", so the refresh never lands.
          git add -u -- data
          if git diff --cached --quiet -- data; then
            echo "No changes to the data"
            exit 0
          fi
          git commit -m "chore: refresh wiki skin data ($(date +%Y-%m-%d))"
          # Another push can land while this job runs, so retry the rebase/push
          # instead of failing the whole refresh on the first rejected push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "could not push the refreshed data"
          exit 1
