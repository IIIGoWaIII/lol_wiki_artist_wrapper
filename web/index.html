<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Filterable gallery of League of Legends, Wild Rift and Legends of Runeterra splash art, with full-resolution originals and older artwork versions.">
<title>LoL Splash Reference</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="sbToggle" aria-label="Toggle filters">&#9776;</button>
<div id="sbOverlay" hidden></div>
<div class="layout">
  <aside id="sidebar">
    <section id="filters">
      <button id="clearbtn" title="Clear filters" hidden>Clear</button>
      <!-- Panels are rendered from the catalogue's meta.tagGroups; see app.js. -->
      <div id="panels"></div>

      <div class="selrow">
        <select id="fYear" title="Release year"><option value="">Any year</option></select>
        <select id="fSort" title="Sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">Champion A&rarr;Z</option>
          <option value="za">Champion Z&rarr;A</option>
        </select>
      </div>
    </section>
  </aside>

  <div class="content">
    <!-- One sticky header: the tabs plus, in the Reference tab, the board's
         search field and library chips. -->
    <header id="topbar">
      <nav id="gametabs" role="tablist" aria-label="Game">
        <button class="gtab on" data-game="lol" role="tab" aria-selected="true">League of Legends</button>
        <button class="gtab" data-game="wr" role="tab" aria-selected="false">Wild Rift</button>
        <button class="gtab" data-game="lor" role="tab" aria-selected="false">Legends of Runeterra</button>
        <button class="gtab" data-game="ref" role="tab" aria-selected="false">Reference</button>
      </nav>

      <div id="refbar" hidden>
        <div class="refsearch">
          <input id="refq" type="search" autocomplete="off" spellcheck="false"
            placeholder="Search films, directors, artists, movements…" aria-label="Search the reference board">
        </div>
        <div id="refsrc" role="group" aria-label="Library"></div>
        <span id="refcount" aria-live="polite"></span>
      </div>
    </header>

    <main id="grid"></main>

    <div id="empty" hidden>
      <p>No skins match your filters.</p>
    </div>
    <button id="more" hidden>Show more</button>
  </div>
</div>

<div id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbName">
  <div id="lbStage">
    <button id="lbClose" title="Close (Esc)">&times;</button>
    <button id="lbPrev" title="Previous (&larr;)">&#8249;</button>
    <div id="lbImgWrap"><div id="lbLoadBar"></div><img id="lbImg" alt="Splash art" draggable="false"><div id="lbNoArt" hidden>No artwork on the wiki for this skin.</div><div id="lbLens"><img id="lbLensImg" alt=""></div></div>
    <button id="lbNext" title="Next (&rarr;)">&#8250;</button>
  </div>
  <aside id="lbMeta">
    <h2 id="lbName"></h2>
    <div id="lbChamp"></div>
    <div id="lbPos"></div>
    <dl id="lbInfo"></dl>
    <div id="lbVers" hidden>
      <h3>Other versions</h3>
      <div id="lbVersGrid"></div>
    </div>
  </aside>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
